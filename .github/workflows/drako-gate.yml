# Reusable PR Governance Gate (Drako v4 — 100% offline, least-privilege)
# Scans code, coding-agent instruction/skill files, scope drift, and receipts.

name: drako-gate

on:
  workflow_call:
    inputs:
      drako-package:
        description: "Package spec to install (default: drako; pass '.' for in-repo self-tests)"
        required: false
        type: string
        default: "drako"
      fail-on:
        description: "Severity threshold for drako scan / skills (low|medium|high|critical)"
        required: false
        type: string
        default: "high"
      pubkey-file:
        description: "Optional Ed25519 public key PEM path for receipt verification"
        required: false
        type: string
        default: ""
  workflow_dispatch:

permissions:
  contents: read

jobs:
  govern:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install Drako v4
        run: pip install "${{ inputs.drako-package || 'drako' }}"

      - name: Static governance scan
        run: drako scan . --format json --fail-on "${{ inputs.fail-on || 'high' }}" > scan.json

      - name: Instruction & Skill file poisoning scan (INST-001..005)
        run: drako desktop skills . --fail-on "${{ inputs.fail-on || 'high' }}"

      - name: Scope drift check (when ACS policy profile exists)
        run: |
          if [ -f drako-policy.yaml ]; then
            drako drift --profile drako-policy.yaml
          else
            echo "No drako-policy.yaml present; skipping drift gate."
          fi

      - name: Offline Ed25519 receipt verification (when present)
        run: |
          if [ -f .drako/receipts.jsonl ]; then
            if [ -n "${{ inputs.pubkey-file }}" ] && [ -f "${{ inputs.pubkey-file }}" ]; then
              drako verify .drako/receipts.jsonl --pubkey-file "${{ inputs.pubkey-file }}"
            else
              drako verify .drako/receipts.jsonl
            fi
          else
            echo "No .drako/receipts.jsonl present; skipping receipt verification."
          fi
