# Drako Governance Scan — GitHub Action template (100% offline, Apache-2.0)
#
# Copy this file to your repo at .github/workflows/drako-scan.yml
# to run offline governance scans on every push and pull request.

name: Drako Governance Scan

on: [push, pull_request]

permissions:
  contents: read
  security-events: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - run: pip install drako

      - name: Run Drako scan (SARIF)
        run: drako scan . --format sarif --fail-on critical > results.sarif

      - uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: results.sarif
        if: always()
