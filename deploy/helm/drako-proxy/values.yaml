replicaCount: 1

image:
  repository: ghcr.io/drakolabs/drako-proxy
  tag: "4.0.0a1"
  pullPolicy: IfNotPresent

nameOverride: ""
fullnameOverride: ""

service:
  type: ClusterIP
  port: 8990

config:
  # Bearer token protecting /status and /audit evidence endpoints (or use existingSecret)
  proxyToken: ""
  # Name of existing Kubernetes secret containing the proxy token
  existingSecret: ""
  # Key name within the existing secret
  existingSecretKey: "DRAKO_PROXY_TOKEN"
  # Bind address inside the container
  bindHost: "0.0.0.0"
  # Path to mounted .drako.yaml inside container
  configPath: "/app/.drako.yaml"

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi

# Pod annotations
podAnnotations: {}

# Node selector
nodeSelector: {}

# Tolerations
tolerations: []

# Affinity rules
affinity: {}

# Liveness and readiness probes
livenessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10

readinessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 3
  periodSeconds: 5

# Custom .drako.yaml content (optional)
# If set, mounted at /app/.drako.yaml via ConfigMap
drakoConfig: ""

# Custom drako-policy.yaml ACS policy profile (optional)
# If set, mounted at /app/drako-policy.yaml via ConfigMap
drakoPolicy: ""
