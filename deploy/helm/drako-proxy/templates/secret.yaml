{{- if and .Values.config.proxyToken (not .Values.config.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "drako-proxy.fullname" . }}-secret
  labels:
    {{- include "drako-proxy.labels" . | nindent 4 }}
type: Opaque
data:
  DRAKO_PROXY_TOKEN: {{ .Values.config.proxyToken | b64enc | quote }}
{{- end }}
