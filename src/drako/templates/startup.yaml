# Drako Policy Template: Startup
# Balanced for speed + safety. Move fast without breaking compliance.
#
# Usage:
#   extends: startup
#   (in your .drako.yaml)

governance_level: balanced

kernel:
  spec_pin: AGENT-HOOKS-0.1
  default_effect: deny
  tiers:
    read: auto
    write: audit
    external_comms: audit
    irreversible: consent

loop_breaker:
  enabled: true
  trip_threshold: 10
  window_seconds: 300.0

dlp:
  mode: audit

hitl:
  mode: audit
  triggers:
    tool_types: [payment, execute]
    records_above: 200
  timeout_action: allow
  approval_timeout_minutes: 60

intent_verification:
  mode: "off"

circuit_breaker:
  agent_level:
    failure_threshold: 10
    time_window_seconds: 180
    recovery_timeout_seconds: 30

audit:
  enabled: true
  cryptographic: true
  receipt_store: .drako/receipts.jsonl
  retention_days: 30

finops:
  tracking:
    enabled: true
  budgets:
    daily_usd: 100.0

a2a:
  mode: audit
  require_signed_cards: true

mcp:
  lockfile: mcp.lock
  enforce_pin: true
  allow_auto_install: false
  protocol_version: "2026-07-28"

egress:
  allowed_domains: []
