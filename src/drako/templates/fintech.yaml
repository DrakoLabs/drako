# Drako Policy Template: Financial Services
# Based on: MiFID II, PSD2, SOX, SEC Rule 15c3-5
#
# Usage:
#   extends: fintech
#   (in your .drako.yaml)

governance_level: strict

kernel:
  spec_pin: AGENT-HOOKS-0.1
  default_effect: deny
  tiers:
    read: auto
    write: consent
    external_comms: consent
    irreversible: consent

loop_breaker:
  enabled: true
  trip_threshold: 5
  window_seconds: 300.0

dlp:
  mode: enforce

hitl:
  mode: enforce
  triggers:
    tool_types: [payment, write, execute]
    spend_above_usd: 50.0
    trust_score_below: 70
    records_above: 50
  timeout_action: reject
  approval_timeout_minutes: 15

intent_verification:
  mode: enforce
  required_for:
    tool_types: [payment, write]
  anti_replay: true
  intent_ttl_seconds: 300

circuit_breaker:
  agent_level:
    failure_threshold: 3
    time_window_seconds: 300
    recovery_timeout_seconds: 120

audit:
  enabled: true
  cryptographic: true
  receipt_store: .drako/receipts.jsonl
  retention_days: 365

finops:
  tracking:
    enabled: true
  budgets:
    daily_usd: 100.0
    monthly_usd: 2500.0

a2a:
  mode: enforce
  require_signed_cards: true
  worm_detection:
    enabled: true
    scan_inter_agent_messages: true
    max_propagation_depth: 3
    circular_reference_block: true

mcp:
  lockfile: mcp.lock
  enforce_pin: true
  allow_auto_install: false
  protocol_version: "2026-07-28"

egress:
  allowed_domains: []
