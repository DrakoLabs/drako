# Drako Policy Template: Recommended Defaults
# The baseline local-first configuration for any project.
#
# Usage:
#   extends: base
#   (in your .drako.yaml)

governance_level: autopilot

kernel:
  spec_pin: AGENT-HOOKS-0.1
  default_effect: permit
  tiers:
    read: auto
    write: audit
    external_comms: audit
    irreversible: consent

loop_breaker:
  enabled: true
  trip_threshold: 15
  window_seconds: 300.0

dlp:
  mode: audit

hitl:
  mode: audit
  triggers:
    tool_types: [write, execute, payment]
    records_above: 100
  timeout_action: allow
  approval_timeout_minutes: 30

intent_verification:
  mode: "off"

circuit_breaker:
  agent_level:
    failure_threshold: 5
    time_window_seconds: 120
    recovery_timeout_seconds: 30

audit:
  enabled: true
  cryptographic: true
  receipt_store: .drako/receipts.jsonl
  retention_days: 7

finops:
  tracking:
    enabled: true
  budgets:
    daily_usd: 50.0

a2a:
  mode: audit
  require_signed_cards: true

mcp:
  lockfile: mcp.lock
  enforce_pin: true
  allow_auto_install: false
  protocol_version: "2026-07-28"

egress:
  allowed_domains: []
